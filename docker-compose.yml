services:
  php:
    build: 
      context: './php/'
      args:
       PHP_VERSION: ${PHP_VERSION}
    networks:
      - calldisbknd
    volumes:
      - ${PROJECT_ROOT}/:/usr/local/apache2/htdocs/
    container_name: php
    environment:
      PHP_VERSION: ${PHP_VERSION}
      APACHE_VERSION: ${APACHE_VERSION}
      DB_PATH: ${DB_PATH}
      DB_FILE: ${DB_FILE}
      PROJECT_ROOT: ${PROJECT_ROOT}
  apache:
    build:
      context: './apache/'
      args:
       APACHE_VERSION: ${APACHE_VERSION}
    depends_on:
      - php
    networks:
      - calldisnet
      - calldisbknd
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PROJECT_ROOT}/:/usr/local/apache2/htdocs/
    container_name: apache
    environment:
      PHP_VERSION: ${PHP_VERSION}
      APACHE_VERSION: ${APACHE_VERSION}
      DB_PATH: ${DB_PATH}
      DB_FILE: ${DB_FILE}
      PROJECT_ROOT: ${PROJECT_ROOT}
networks:
  calldisnet:
  calldisbknd:
volumes:
    data:
